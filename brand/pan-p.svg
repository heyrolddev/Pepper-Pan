<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Pepper Pan — the Pan-P monogram">
  <title>Pepper Pan — the Pan-P monogram</title>
  <rect width="512" height="512" rx="112" fill="#b91313"/>

  <!-- One letter doing two jobs: read as a P, and as a pan seen from the
       side with its handle. No character, no face — the McDonald's route,
       where the shape itself is the thing you remember. -->
  <g fill="#fdf1e0">
    <rect x="112" y="120" width="58" height="288" rx="10"/>
    <path d="M112 120 h104 a104 104 0 0 1 0 208 h-104 z"/>
  </g>
  <!-- The counter of the P is the pan: a dark bowl holding peppercorns. -->
  <path d="M170 178 h46 a46 46 0 0 1 0 92 h-46 z" fill="#b91313"/>
  <g fill="#120a08">
    <circle cx="204" cy="216" r="15"/>
    <circle cx="204" cy="248" r="10"/>
  </g>

  <!-- The handle, which is what turns the letter into a pan. -->
  <path d="M330 236 h64 a20 20 0 0 1 0 40 h-64 z" fill="#ffcf00"/>

  <!-- Noodles lifting out of the bowl of the P -->
  <g stroke="#ffcf00" stroke-width="17" stroke-linecap="round" fill="none">
    <path d="M258 118 q10 -46 -24 -66"/>
    <path d="M300 132 q34 -38 12 -74"/>
  </g>
  <g fill="#120a08">
    <circle cx="368" cy="150" r="14"/>
    <circle cx="404" cy="184" r="9"/>
    <circle cx="392" cy="116" r="7"/>
  </g>
</svg>
