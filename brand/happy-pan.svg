<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Pepper Pan — the Happy Pan">
  <title>Pepper Pan — the Happy Pan</title>
  <defs>
    <linearGradient id="pan-iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d2620"/>
      <stop offset="60%" stop-color="#1c110e"/>
      <stop offset="100%" stop-color="#120a08"/>
    </linearGradient>
    <clipPath id="pan-body"><path d="M118 250 h276 a138 138 0 0 1 -276 0 z"/></clipPath>
  </defs>

  <circle cx="256" cy="256" r="256" fill="#b91313"/>
  <circle cx="256" cy="256" r="240" fill="#ffcf00"/>
  <circle cx="256" cy="256" r="228" fill="#fdf1e0"/>

  <!-- Noodles first, so the pan overlaps them and they read as coming OUT
       of it rather than sitting on top. -->
  <g stroke="#ffcf00" stroke-width="20" stroke-linecap="round" fill="none">
    <path d="M186 250 q-16 -74 34 -104 q46 -28 34 -66"/>
    <path d="M248 250 q-6 -84 28 -116"/>
    <path d="M312 250 q22 -66 -8 -104 q-26 -34 6 -62"/>
  </g>
  <g stroke="#e6bb00" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M190 244 q-14 -68 32 -98"/>
    <path d="M316 244 q18 -60 -8 -96"/>
  </g>

  <!-- The pan is the face. The handle is the one asymmetric thing in the
       mark, which is what stops it reading as a generic smiley. -->
  <path d="M382 250 h96 a22 22 0 0 1 0 44 h-96 z" fill="#3d2620"/>
  <path d="M382 250 h96 a22 22 0 0 1 0 44 h-96 z" fill="none" stroke="#120a08" stroke-width="8"/>
  <rect x="404" y="262" width="58" height="9" rx="4.5" fill="#2a1a16"/>

  <path d="M110 232 h292 v26 h-292 z" rx="13" fill="#2a1a16"/>
  <rect x="106" y="228" width="300" height="30" rx="15" fill="#3d2620"/>
  <path d="M118 250 h276 a138 138 0 0 1 -276 0 z" fill="url(#pan-iron)"/>

  <!-- Face on the pan body -->
  <g clip-path="url(#pan-body)">
    <ellipse cx="206" cy="316" rx="30" ry="33" fill="#fffaf2"/>
    <ellipse cx="306" cy="316" rx="30" ry="33" fill="#fffaf2"/>
    <circle cx="212" cy="323" r="15" fill="#120a08"/>
    <circle cx="300" cy="323" r="15" fill="#120a08"/>
    <circle cx="218" cy="314" r="6" fill="#fffaf2"/>
    <circle cx="306" cy="314" r="6" fill="#fffaf2"/>
    <g fill="#e36158" opacity="0.5">
      <ellipse cx="160" cy="352" rx="20" ry="13"/>
      <ellipse cx="352" cy="352" rx="20" ry="13"/>
    </g>
    <path d="M212 358 q44 56 88 0 z" fill="#fffaf2"/>
    <path d="M240 388 q16 20 32 0 z" fill="#cc3226"/>
  </g>

  <!-- Peppercorns tumbling in -->
  <g fill="#120a08">
    <circle cx="352" cy="196" r="13"/>
    <circle cx="386" cy="164" r="9"/>
    <circle cx="330" cy="152" r="7"/>
  </g>
</svg>
